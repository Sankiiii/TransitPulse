# ==============================================================================
# TransitPulse Application Configuration
# Smart Public Transport Route & Crowd Management System (Mumbai MMR)
# MCA Project - Data Analytics & Distributed Systems
# ==============================================================================

# Server HTTP Port
server.port=8080

# ------------------------------------------------------------------------------
# DATASOURCE MODE TOGGLE:
# 'json'  : Runs 100% locally using pre-seeded JSON files (Default for Mac testing - NO MySQL required!)
# 'mysql' : Connects directly to MySQL Workbench via JDBC (For her Windows laptop)
# ------------------------------------------------------------------------------
app.datasource.mode=json

# ------------------------------------------------------------------------------
# MySQL Workbench Connection Details (Active when app.datasource.mode=mysql)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/transitpulse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# Google Gemini AI Integration (Smart Commute Advisor)
# Provide your Gemini API key below or via GEMINI_API_KEY environment variable.
# Leave as placeholder to use the built-in resilient PulseAI Mumbai Engine.
# ------------------------------------------------------------------------------
gemini.api.key=YOUR_GEMINI_API_KEY
gemini.model=gemini-3.8-flash

